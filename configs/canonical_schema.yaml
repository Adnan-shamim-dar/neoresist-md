schema_version: "1.0.0"
column_groups:
  provenance:
    - patient_id
    - sample_barcode
    - run_id
    - timestamp
    - schema_version
    - source_module
  mutation:
    - gene
    - protein_change
    - genomic_locus
    - chrom
    - pos
    - ref
    - alt
    - ref_count
    - alt_count
    - vaf
  peptide:
    - mutant_peptide
    - wildtype_peptide
    - peptide_length
    - peptide_position
    - peptide_source
  binding:
    - binding_affinity
    - binding_rank
    - binding_tool
    - binding_tool_version
    - hla_allele
    - binding_confidence
  presentation:
    - cleavage_score
    - tap_score
    - presentation_composite
    - presentation_tool
    - presentation_confidence
  expression:
    - expression_tpm
    - expression_flag
    - expression_confidence
    - expression_tool
  clonality:
    - tumour_purity
    - local_copy_number
    - ccf
    - ccf_cluster
    - clonality_class
    - clonality_confidence
    - clonality_tool
  escape:
    - hla_loh_status
    - hla_loh_probability
    - allele_integrity_flag
    - processing_disruption_flag
    - escape_tool
    - escape_confidence
  recognition:
    - self_dissimilarity
    - mutant_wt_distance
    - recognition_score
    - recognition_tool
    - recognition_confidence
  resistance:
    - resistance_loh_penalty
    - resistance_volatility_flag
    - resistance_expression_instability
    - resistance_processing_disruption
    - resistance_composite
    - resistance_confidence
  strategy:
    - strategy_id
    - strategy_source
    - weight_vector_json
  action:
    - exclusion_flags
    - exclusion_reasons
    - tier
    - composite_priority
    - report_summary
defaults:
  expression_flag: UNKNOWN
  clonality_class: UNKNOWN
  hla_loh_status: UNKNOWN
  binding_confidence: GREY
  presentation_confidence: GREY
  expression_confidence: GREY
  clonality_confidence: GREY
  escape_confidence: GREY
  recognition_confidence: GREY
  resistance_confidence: GREY
